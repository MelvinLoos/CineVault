---
- name: Prepare Molecule environment
  hosts: all
  # Deliberately non-privileged: the task below is delegated to the controller
  # (localhost). On CI runners ansible-galaxy lives in the pipx-managed
  # ~/.local/bin, which sudo's secure_path does not include.
  pre_tasks:
    - name: Install required collections
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r {{ playbook_dir }}/../../ansible/requirements.yml
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

- name: Route Molecule to the production playbook
  ansible.builtin.import_playbook: "../../ansible/playbooks/provision_host.yml"
