---
# Uptime Kuma first-run verification (Observability bounded context).
#
# The pinned 2.5.5 image exposes NO REST endpoint for admin creation (the
# POST /api/setup route only exists on newer, better-auth-based master), so
# the playbook cannot create the account itself. It verifies instead:
#
#   GET /api/entry-page -> entryPage == "setup" while first-run setup is
#   pending, "dashboard" once an admin account exists.
#
# With UPTIME_KUMA_ADMIN_USERNAME/PASSWORD configured in
# /opt/mediastack/.env the check is STRICT (fails the play with setup
# instructions); without credentials (e.g. Molecule CI) it degrades to a
# warning so ephemeral test VMs stay green.

- name: Uptime Kuma - Extract admin credentials from host .env
  ansible.builtin.shell:
    cmd: awk -F '=' '/^UPTIME_KUMA_ADMIN_(USERNAME|PASSWORD)=/ {print $2}' /opt/mediastack/.env
  register: uptime_kuma_creds_cmd
  changed_when: false
  failed_when: false
  no_log: true
  tags:
    - deployment
    - uptime-kuma

- name: Uptime Kuma - Set admin credential facts
  ansible.builtin.set_fact:
    uptime_kuma_admin_username: "{{ uptime_kuma_creds_cmd.stdout_lines[0] | default('') | trim }}"
    uptime_kuma_admin_password: "{{ uptime_kuma_creds_cmd.stdout_lines[1] | default('') | trim }}"
  tags:
    - deployment
    - uptime-kuma

- name: Uptime Kuma - Wait for the WebUI to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:3001/"
    method: GET
    status_code: [200]
  register: uptime_kuma_ready
  until: uptime_kuma_ready.status == 200
  retries: 30
  delay: 10
  tags:
    - deployment
    - uptime-kuma

- name: Uptime Kuma - Query entry page state
  ansible.builtin.uri:
    url: "http://127.0.0.1:3001/api/entry-page"
    method: GET
    status_code: [200]
  register: uptime_kuma_entry_page
  changed_when: false
  tags:
    - deployment
    - uptime-kuma

- name: Uptime Kuma - Warn when first-run setup is still pending
  ansible.builtin.debug:
    msg: >-
      [WARNING] Uptime Kuma first-run setup is pending: open
      http://{{ web_hostname | default('mediacenter.local') }}:3001 and create
      the admin account (or run `docker exec -it uptime-kuma npm run
      reset-password`), then re-run this playbook.
  when:
    - (uptime_kuma_entry_page.json | default({})).entryPage | default('') == 'setup'
    - not (uptime_kuma_admin_username | length > 0 and uptime_kuma_admin_password | length > 0)
  tags:
    - deployment
    - uptime-kuma

- name: Uptime Kuma - Fail fast when first-run setup is pending (strict mode)
  ansible.builtin.fail:
    msg: >-
      Uptime Kuma first-run setup is still pending, but
      UPTIME_KUMA_ADMIN_USERNAME/PASSWORD are configured. Open
      http://{{ web_hostname | default('mediacenter.local') }}:3001 and create
      the admin account (or run `docker exec -it uptime-kuma npm run
      reset-password`), then re-run this playbook.
  when:
    - (uptime_kuma_entry_page.json | default({})).entryPage | default('') == 'setup'
    - uptime_kuma_admin_username | length > 0
    - uptime_kuma_admin_password | length > 0
  tags:
    - deployment
    - uptime-kuma