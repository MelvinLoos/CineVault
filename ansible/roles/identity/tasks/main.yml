---
# Identity & Zero Root Execution (ARCHITECTURE.md §3, AGENTS.md §3).
# Owns the role-based hostname of The Host (so it resolves as
# mediacenter.local over mDNS regardless of its DHCP-assigned address) and
# the dedicated non-root mediasvc system identity used as PUID/PGID by every
# container in the stack.

- name: Ensure current and target hostnames resolve locally during rename
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ ([ansible_facts['hostname'], mediacenter_hostname | default('mediacenter')] | unique) | join(' ') }}"
  when: ansible_facts['hostname'] != (mediacenter_hostname | default('mediacenter'))
  tags:
    - identity

- name: Ensure system hostname is set to role-based name
  ansible.builtin.hostname:
    name: "{{ mediacenter_hostname | default('mediacenter') }}"
  tags:
    - identity

- name: Ensure role-based hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+'
    line: "127.0.1.1 {{ mediacenter_hostname | default('mediacenter') }}"
  tags:
    - identity

- name: Identity & Zero Root Execution - Create mediasvc group
  ansible.builtin.group:
    name: mediasvc
    gid: "{{ mediasvc_gid }}"
    state: present
    system: true # Mark as a system group
  tags:
    - identity

- name: Identity & Zero Root Execution - Create dedicated system user mediasvc (non-login, no home directory)
  ansible.builtin.user:
    name: mediasvc
    uid: "{{ mediasvc_uid }}"
    group: mediasvc
    home: /nonexistent # No home directory
    shell: /usr/sbin/nologin # Non-login shell
    state: present
    system: true # Mark as a system user
    create_home: false
  tags:
    - identity
