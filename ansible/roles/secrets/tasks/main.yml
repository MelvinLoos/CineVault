---
# Secrets bounded context: API keys and database passwords for the stack.
# Everything is generated idempotently on the control node — lookup('password')
# persists values under ansible/credentials/ and reuses them on later runs, so
# keys never silently rotate away from what the running containers expect.

- name: Configuration - Ensure local credentials directory exists on control node
  ansible.builtin.file:
    path: "{{ playbook_dir }}/credentials"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  tags:
    - secrets

- name: Configuration - Generate Idempotent API Keys
  ansible.builtin.set_fact:
    secrets_radarr_key: "{{ lookup('password', playbook_dir + '/../credentials/radarr.key chars=hexdigits length=32') }}"
    secrets_sonarr_key: "{{ lookup('password', playbook_dir + '/../credentials/sonarr.key chars=hexdigits length=32') }}"
    secrets_prowlarr_key: "{{ lookup('password', playbook_dir + '/../credentials/prowlarr.key chars=hexdigits length=32') }}"
    secrets_bazarr_key: "{{ lookup('password', playbook_dir + '/../credentials/bazarr.key chars=hexdigits length=32') }}"
    secrets_sabnzbd_key: "{{ lookup('password', playbook_dir + '/../credentials/sabnzbd.key chars=hexdigits length=32') }}"
  tags:
    - secrets

- name: Configuration - Generate Idempotent Spotweb DB Passwords
  ansible.builtin.set_fact:
    secrets_spotweb_db_root_password: "{{ lookup('password', playbook_dir + '/../credentials/spotweb_root.key chars=ascii_letters,digits length=24') }}"
    secrets_spotweb_db_password: "{{ lookup('password', playbook_dir + '/../credentials/spotweb.key chars=ascii_letters,digits length=24') }}"
  tags:
    - secrets
