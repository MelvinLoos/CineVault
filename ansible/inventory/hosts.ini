# The Host: Intel N100 Mini-PC running Debian 13 "Trixie"
# Ubiquitous Language: PRODUCT_SPECIFICATION.md §1
#
# Day 1 (Bootstrap): The Host is not yet provisioned, so Avahi/mDNS is not
# installed and 'mediacenter.local' cannot resolve. Target its DHCP address
# directly for the very first run, e.g.:
#   192.168.1.150 ansible_user=ansible media_drive_device=
#
# Day 2 (Normal Ops): after provisioning, Avahi advertises the role-based
# hostname and the IP may change via DHCP. Point Ansible at the mDNS name:
[the_host]
mediacenter.local ansible_user=ansible media_drive_device=
# Optional overrides (uncomment when needed):
# mediacenter.local ansible_user=ansible media_drive_device= media_subnet_cidr=192.168.1.0/24
# mediacenter.local ansible_user=ansible media_drive_device= web_hostname=mediacenter.example.lan
