[defaults]
# Inventory path relative to this ansible.cfg (ansible/inventory/hosts.ini)
inventory        = inventory/hosts.ini
# SECURITY: Host key checking is enabled for production use.
# SSH host keys are verified against the known_hosts file to prevent MITM attacks.
# CI environments should override via ANSIBLE_HOST_KEY_CHECKING=false (see .github/workflows/ci.yml).
host_key_checking = True
# SSH connection timeout in seconds.
timeout          = 30
# Default remote user for all plays targeting The Host.
remote_user      = ansible

[ssh_connection]
ssh_args = -o UserKnownHostsFile=~/.ssh/known_hosts
control_path_dir = /tmp/.ansible-cp-%h-%p-%r
