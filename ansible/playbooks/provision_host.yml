---
# Provision The Host (Intel N100 Mini-PC running Debian 13 "Trixie").
#
# Thin orchestration entry point: shared variables and cross-cutting host-fact
# discovery live here; every provisioning step is decomposed into a
# single-responsibility role under ansible/roles/. Run targeted slices with
# --tags <role> (e.g. --tags filesystem, --tags backup).
- name: Provision The Host (Intel N100 Mini-PC running Debian 13 "Trixie")  # noqa: fqcn[keyword]
  hosts: the_host
  become: true
  # Explicit collection declarations (issue #26, finding I-3): the block
  # documents the playbook's dependency surface at the top level. The noqa is
  # required because every module invocation already uses FQCN (fqcn[keyword]
  # prefers dropping the keyword in that case), but the declaration is the
  # intentional dependency map for this play.
  collections:  # noqa: fqcn[keyword]
    - community.general
    - community.docker
    - ansible.posix
    - ansible.utils
  vars:
    # PUID/PGID for the mediasvc user, as mandated by ARCHITECTURE.md for Zero Root Execution.
    # These values are chosen to be outside the typical system reserved range and common
    # default user IDs, ensuring a deterministic identity for all container operations.
    mediasvc_uid: 5000
    mediasvc_gid: 5000
    media_drive_device: ""
    # Canonical role-based hostname for The Host. Set on first run; avahi-daemon
    # advertises it on the LAN so The Host resolves as mediacenter.local
    # regardless of its DHCP-assigned IP address (mDNS).
    mediacenter_hostname: "mediacenter"
    # Hostname used in user-facing Homepage dashboard links and in the
    # distributed Tdarr node script. Override via inventory host vars when a
    # non-default DNS suffix/label is in use.
    web_hostname: "mediacenter.local"
    # Local subnet permitted to mount The Library via NFS (media offloading)
    # and to reach the Tdarr Server control plane (8266). Auto-detected from
    # The Host's default-route network facts; optionally overridden per-host
    # via inventory (media_subnet_cidr=...). Scoped strictly to enforce
    # zero-trust micro-segmentation (ARCHITECTURE.md §2).
    media_subnet_cidr: ""
    # SSOT Category Tag linking Sonarr ⇄ SABnzbd (PRODUCT_SPECIFICATION.md §2).
    # Must be byte-identical across recyclarr.yml.j2 and config.xml.j2.
    # Any drift causes "Download wasn't grabbed by sonarr, skipping" failures.
    # See: .ruler/specs/active/bug-sonarr-sabnzbd-sync.md
    sonarr_sabnzbd_category: "tv-sonarr"

  # ---------------------------------------------------------------------------
  # Cross-cutting prerequisites, deliberately kept out of the roles so that
  # no role depends on a sibling role having run first:
  #   - media_subnet_cidr  : consumed by security (UFW) and filesystem (NFS)
  #   - host_has_quicksync : consumed by deployment (docker-compose template)
  #   - system preparation : GRUB preseed + apt cache refresh/upgrade must
  #     complete before any role installs packages
  # ---------------------------------------------------------------------------
  pre_tasks:
    - name: Calculate LAN Subnet CIDR from host network facts
      # Compose the address/netmask pair and let the ipaddr filter derive the
      # canonical network/prefix form (e.g. 192.168.2.42/255.255.255.0 ->
      # "192.168.2.0/24"). Applying ipaddr('prefix') to a bare netmask would
      # yield the no-bits-count default (32), so the pair must be composed.
      # ansible_facts[] (rather than the deprecated injected ansible_* alias)
      # keeps this working once INJECT_FACTS_AS_VARS defaults to false in 2.24.
      ansible.builtin.set_fact:
        media_subnet_cidr: >-
          {{ (ansible_facts['default_ipv4'].address ~ '/' ~ ansible_facts['default_ipv4'].netmask)
          | ansible.utils.ipaddr('network/prefix') }}
      when: media_subnet_cidr is not defined or media_subnet_cidr == ""
      tags:
        - security
        - filesystem

    - name: Display detected Media Subnet CIDR
      ansible.builtin.debug:
        msg: "Configuring NFS and UFW rules for subnet: {{ media_subnet_cidr }}"
      tags:
        - security
        - filesystem

    - name: Hardware Detection - Check if Intel QuickSync GPU is physically present
      ansible.builtin.stat:
        path: /dev/dri/renderD128
      register: quicksync_device
      tags:
        - deployment

    - name: Hardware Detection - Set QuickSync capability fact
      ansible.builtin.set_fact:
        host_has_quicksync: "{{ quicksync_device.stat.exists }}"
      tags:
        - deployment

    - name: Hardware Detection - Default QuickSync capability to false
      ansible.builtin.set_fact:
        host_has_quicksync: false
      when: host_has_quicksync is not defined
      tags:
        - deployment

    - name: System Preparation - Pre-seed GRUB to bypass Legacy BIOS prompts in Vagrant
      ansible.builtin.debconf:
        name: grub-pc
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: 'grub-pc/install_devices', value: '', vtype: 'multiselect' }
        - { question: 'grub-pc/install_devices_empty', value: 'true', vtype: 'boolean' }
      tags:
        - security
        - filesystem
        - docker
        - backup

    - name: System Preparation - Update apt package cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: true
        dpkg_options: 'force-confdef,force-confold'
        autoclean: true
        autoremove: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      tags:
        - security
        - filesystem
        - docker
        - backup

  roles:
    - role: identity
    - role: security
    - role: filesystem
    - role: docker
    - role: secrets
    - role: configuration
    - role: deployment
    - role: backup
